
<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GreenLoop reuse and recycling management dashboard.">
    <title>GreenLoop | Reuse & Recycling Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
